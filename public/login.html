<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Nautica Aire Libre</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/auth.css">

    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    
    <!-- App Config & Auth Module -->
    <script src="/js/firebase-config.js"></script>
    <script src="/js/auth.js"></script>
</head>
<body>

    <!-- Simplified Navbar for Login -->
    <header class="navbar" style="padding: 1rem; border-bottom: 1px solid rgba(240, 244, 248, 0.1);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="/" class="logo" style="color: var(--orange); text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-size: 1.5rem; text-transform: uppercase; font-weight: 600;">
                Nautica Aire Libre
            </a>
            <nav>
                <a href="/" style="color: var(--white); text-decoration: none; font-family: 'Barlow Condensed', sans-serif; text-transform: uppercase; font-size: 1.1rem; transition: color 0.3s ease;">Volver al Inicio</a>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <!-- Loading Overlay -->
            <div class="loading-overlay" id="loadingOverlay">
                <div class="spinner"></div>
            </div>

            <div class="auth-logo">
                <h2>Nautica Aire Libre</h2>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchTab('login')">Iniciar Sesión</button>
                <button class="auth-tab" onclick="switchTab('register')">Registrarse</button>
            </div>

            <div id="messageArea" class="message-area"></div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label for="loginEmail">Correo Electrónico</label>
                    <input type="email" id="loginEmail" class="form-control" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Contraseña</label>
                    <input type="password" id="loginPassword" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regName">Nombre Completo</label>
                    <input type="text" id="regName" class="form-control" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="regEmail">Correo Electrónico</label>
                    <input type="email" id="regEmail" class="form-control" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" class="form-control" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="regConfirmPassword">Confirmar Contraseña</label>
                    <input type="password" id="regConfirmPassword" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary">Crear Cuenta</button>
            </form>

            <div class="divider">o</div>

            <button type="button" class="btn btn-google" id="btnGoogle">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
                Continuar con Google
            </button>
        </div>
    </main>

    <footer class="footer">
        <div class="container" style="text-align: center; padding: 1rem; color: var(--muted); font-size: 0.9rem; border-top: 1px solid rgba(240, 244, 248, 0.1);">
            &copy; <span id="year"></span> Nautica Aire Libre. Todos los derechos reservados.
        </div>
    </footer>

    <!-- Login Logic -->
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
            showMessage('', ''); // Clear messages
        }

        function showMessage(msg, type) {
            const msgArea = document.getElementById('messageArea');
            if (!msg) {
                msgArea.className = 'message-area';
                msgArea.textContent = '';
                return;
            }
            msgArea.textContent = msg;
            msgArea.className = `message-area ${type}`;
        }

        function toggleLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) overlay.classList.add('active');
            else overlay.classList.remove('active');
        }

        function handlePostLoginRedirect(role) {
            if (role === 'admin') {
                window.location.href = '/admin/';
            } else if (role === 'vendedor') {
                window.location.href = '/vendedor/';
            } else {
                window.location.href = '/cliente/';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Check if already logged in when auth state initializes
            authModule.onAuthStateChange((user, role, branch) => {
                if (user) {
                    // Automatically redirect if already logged in
                    handlePostLoginRedirect(role);
                }
            });

            // Handle Login
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                
                toggleLoading(true);
                showMessage('', '');
                
                try {
                    await authModule.loginWithEmail(email, password);
                    // onAuthStateChange will handle the redirect
                } catch (error) {
                    toggleLoading(false);
                    showMessage('Error al iniciar sesión. Verifica tus credenciales.', 'error');
                }
            });

            // Handle Register
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('regName').value;
                const email = document.getElementById('regEmail').value;
                const password = document.getElementById('regPassword').value;
                const confirm = document.getElementById('regConfirmPassword').value;
                
                if (password !== confirm) {
                    showMessage('Las contraseñas no coinciden.', 'error');
                    return;
                }
                
                toggleLoading(true);
                showMessage('', '');
                
                try {
                    await authModule.registerWithEmail(email, password, name);
                    // onAuthStateChange will handle the redirect
                } catch (error) {
                    toggleLoading(false);
                    showMessage('Error al registrar. Intenta con otro correo o contraseña más segura.', 'error');
                }
            });

            // Handle Google Sign-in
            document.getElementById('btnGoogle').addEventListener('click', async () => {
                toggleLoading(true);
                showMessage('', '');
                
                try {
                    await authModule.loginWithGoogle();
                    // onAuthStateChange will handle the redirect
                } catch (error) {
                    toggleLoading(false);
                    showMessage('Error al iniciar sesión con Google.', 'error');
                }
            });
        });
    </script>
</body>
</html>
